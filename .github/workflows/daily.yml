name: Auto-Vocab-Daily

on:
  schedule:
    #- cron: '0 19 * * *'   # JST04:00 → パターン①（会話なし）
    #- cron: '0 9  * * *'   # JST18:00 → パターン②（最後に会話1ブロック）
    #- cron: '0 15 * * *'   # JST00:00 → パターン③（毎ラウンド会話）
  workflow_dispatch:
    inputs:
      mode:
        description: "動画構成モード（手動実行時に選択）"
        required: true
        default: "no-convo"
        type: choice
        options:
          - no-convo      # ① 単語＋例文のみ
          - final-convo   # ② 最後に会話1ブロック
          - every-convo   # ③ 各ラウンドで会話
      target:
        description: "アップロード先アカウント（acc1〜acc9）。空なら全アカウント"
        required: false
        default: ""

concurrency:
  group: auto-vocab-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 540
    env:
      # 手動実行時: ここに inputs.target が入る / スケジュール時: 空（→ 全アカウント）
      TARGET_ACCOUNT: ${{ github.event.inputs.target }}

    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 Install requirements
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: 🔑 Restore YouTube tokens
        env:
          YT_ACC1: ${{ secrets.YT_TOKEN_ACC1 }}
          YT_ACC2: ${{ secrets.YT_TOKEN_ACC2 }}
          YT_ACC3: ${{ secrets.YT_TOKEN_ACC3 }}
          YT_ACC4: ${{ secrets.YT_TOKEN_ACC4 }}
          YT_ACC5: ${{ secrets.YT_TOKEN_ACC5 }}
          YT_ACC6: ${{ secrets.YT_TOKEN_ACC6 }}
          YT_ACC7: ${{ secrets.YT_TOKEN_ACC7 }}
          YT_ACC8: ${{ secrets.YT_TOKEN_ACC8 }}
          YT_ACC9: ${{ secrets.YT_TOKEN_ACC9 }}
        run: |
          mkdir -p tokens
          for i in {1..9}; do
            VAL=$(printenv YT_ACC${i})
            if [ -n "$VAL" ]; then
              echo "Restoring acc${i}..."
              echo "$VAL" | base64 -d > "tokens/token_acc${i}.pkl"
            fi
          done

      # ──────────────── パターン① 単語＋例文のみ ────────────────
      # スケジュール: 0 19 * * *（JST04:00）
      # 手動: inputs.mode == no-convo
      - name: 🎬 Pattern ① Vocab + Example only
        if: |
          github.event.schedule == '0 19 * * *' ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'no-convo')
        env:
          OPENAI_API_KEY:      ${{ secrets.OPENAI_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          VOCAB_WORDS:         150
          WORD_REPEAT:         2
          NO_CONVO:            "1"     # ← 会話なし
          # 手動で target を選んだらそのチャンネルのみ / 空なら main.py が全アカウント処理
          TARGET_ACCOUNT:      ${{ env.TARGET_ACCOUNT }}
        run: |
          python main.py AUTO --privacy public --chunk 120

      # ──────────────── パターン② 最後に会話 ────────────────
      # スケジュール: 0 9 * * *（JST18:00）
      # 手動: inputs.mode == final-convo
      - name: 🎬 Pattern ② Vocab + Example + Final Convo
        if: |
          github.event.schedule == '0 9 * * *' ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'final-convo')
        env:
          OPENAI_API_KEY:      ${{ secrets.OPENAI_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          VOCAB_WORDS:         40
          WORD_REPEAT:         1
          NO_CONVO:            "0"
          CONVO_LINES:         10
          TARGET_ACCOUNT:      ${{ env.TARGET_ACCOUNT }}
        run: |
          python main.py AUTO --privacy public --chunk 120

      # ──────────────── パターン③ 各ラウンドごとに会話 ────────────────
      # スケジュール: 0 15 * * *（JST00:00）
      # 手動: inputs.mode == every-convo
      - name: 🎬 Pattern ③ Every-round Convo
        if: |
          github.event.schedule == '0 15 * * *' ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'every-convo')
        env:
          OPENAI_API_KEY:      ${{ secrets.OPENAI_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          VOCAB_WORDS:         10
          VOCAB_ROUNDS:        5
          WORD_REPEAT:         1
          NO_CONVO:            "0"
          CONVO_LINES:         6
          TARGET_ACCOUNT:      ${{ env.TARGET_ACCOUNT }}
        run: |
          python main.py AUTO --privacy public --chunk 120